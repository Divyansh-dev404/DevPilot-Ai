version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: devpilot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devpilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devpilot-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.7.3
    container_name: devpilot-qdrant
    ports:
      - "6333:6333"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devpilot-backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
    depends_on:
      - postgres
      - redis
      - qdrant

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: devpilot-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
